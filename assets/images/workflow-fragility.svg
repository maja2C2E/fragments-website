<svg xmlns="http://www.w3.org/2000/svg" width="600" height="370" viewBox="0 0 600 370" role="img" aria-labelledby="title desc">
<title id="title">Masonry damage — schematic fragility curves</title>
<desc id="desc">Four illustrative curves show the probability of reaching or exceeding increasing damage states as seismic intensity increases: slight in green, moderate in yellow, extensive in orange and severe in red. Severe is the worst damage state shown. This is a conceptual illustration, not calibrated project results or a formal damage classification.</desc>
